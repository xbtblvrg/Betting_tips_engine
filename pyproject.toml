[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "betting-tips-engine"
version = "0.2.0"
description = "Independent five-league sports models, continuous market research and local dashboard"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "numpy>=2,<3", "scipy>=1.15,<2", "scikit-learn>=1.6,<2",
  "joblib>=1.4,<2", "pyarrow>=19,<26"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
betting-engine = "betting_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
betting_engine = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
